# file: k8s/cwvj-devsecops-demo-deploy.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cwvj-devsecops-demo
  labels:
    app: cwvj-devsecops-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cwvj-devsecops-demo
  template:
    metadata:
      labels:
        app: cwvj-devsecops-demo
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: cwvj-devsecops-demo
      containers:
        - name: cwvj-devsecops-demo
          image: 383189130746.dkr.ecr.us-east-1.amazonaws.com/maven-app:14
          ports:
            - containerPort: 8080
